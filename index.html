<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de Venta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Sistema de Punto de Venta</h1>
    </header>

    <div class="main-content">
      <section class="products-section">
        <div class="search-box">
          <input type="text" id="barcode-input" placeholder="Escanear código de barras o ingresar código..." autofocus>
        </div>

        <div class="catalog">
          <h2>Catálogo de Productos</h2>
          <div id="product-list" class="product-grid"></div>
        </div>
      </section>

      <section class="cart-section">
        <h2>Carrito de Compra</h2>
        <table id="cart-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cant.</th>
              <th>Precio</th>
              <th>Total</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="cart-body"></tbody>
        </table>

        <div class="cart-summary">
          <div class="total-row">
            <span>Total a pagar:</span>
            <span id="cart-total">$0.00</span>
          </div>

          <div class="payment-method-container">
            <label for="payment-method">Método de Pago:</label>
            <select id="payment-method">
              <option value="Efectivo">Efectivo</option>
              <option value="Punto de Venta">Punto de Venta (Tarjeta)</option>
              <option value="BioPago">BioPago</option>
              <option value="Pago Móvil">Pago Móvil</option>
            </select>
          </div>

          <div id="pago-movil-container" class="pago-movil-input-group hidden">
            <label for="pago-movil-ref">Referencia Pago Móvil (Últimos 4 dígitos):</label>
            <input type="text" id="pago-movil-ref" maxlength="4" placeholder="Ej: 1234" pattern="[0-9]{4}">
          </div>

          <button id="btn-checkout" class="btn-primary">Procesar Pago y Generar Factura</button>
        </div>
      </section>
    </div>

    <!-- Modal Factura -->
    <div id="receipt-modal" class="modal hidden">
      <div class="modal-content">
        <div id="receipt-print-area">
          <h3>FACTURA DE VENTA</h3>
          <p id="receipt-date"></p>
          <hr>
          <div id="receipt-items"></div>
          <hr>
          <p><strong>Método de Pago:</strong> <span id="receipt-payment-method"></span></p>
          <p id="receipt-ref-row" class="hidden"><strong>Referencia:</strong> <span id="receipt-ref"></span></p>
          <p class="receipt-total-line"><strong>TOTAL PAGADO:</strong> <span id="receipt-total"></span></p>
          <hr>
          <p class="receipt-footer">¡Gracias por su compra!</p>
        </div>
        <div class="modal-actions">
          <button onclick="window.print()" class="btn-secondary">Imprimir Factura</button>
          <button id="btn-close-modal" class="btn-primary">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
